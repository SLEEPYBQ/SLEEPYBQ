name: Update README stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}
          path: profile/stats.svg
          # A PAT in STATS_TOKEN includes private repositories; otherwise this
          # falls back to public statistics from the workflow token.
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update README stats"
          git push
